apiVersion: apps/v1
kind: Deployment
metadata:
  name: capteur
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capteur
  template:
    metadata:
      labels:
        app: capteur
    spec:
      containers:
        - name: capteur
          image: waitless-capteur:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
---
apiVersion: v1
kind: Service
metadata:
  name: capteur
spec:
  selector:
    app: capteur
  ports:
    - port: 4002
      targetPort: 4002
